version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: code_review_db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password123}
      POSTGRES_DB: ${DATABASE_NAME:-ai_code_review}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: code_review_web
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_HOSTNAME: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-password123}
      DATABASE_NAME: ${DATABASE_NAME:-ai_code_review}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-models/gemini-embedding-001}
      CHROMA_PERSIST_DIR: /workspace/chroma_data
    volumes:
      - ./chroma_data:/workspace/chroma_data

volumes:
  postgres_data:
